<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PhishGuard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Red+Hat+Display:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        :root {
            --cyber-black: #0a0e17;
            --cyber-blue: #00d9ff;
            --cyber-red: #ff0055;
            --cyber-purple: #9945ff;
            --cyber-green: #00ff88;
            --cyber-white: #e8f4f8
        }

        body {
            font-family: 'Red Hat Display', sans-serif;
            background: var(--cyber-black);
            color: var(--cyber-white);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative
        }

        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridScroll 20s linear infinite;
            pointer-events: none;
            z-index: 0
        }

        @keyframes gridScroll {
            0% {
                transform: translateY(0)
            }

            100% {
                transform: translateY(50px)
            }
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 217, 255, 0.02) 50%, transparent 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.5
        }

        .login-container {
            position: relative;
            z-index: 2;
            max-width: 500px;
            width: 100%;
            padding: 20px
        }

        .login-card {
            background: rgba(26, 31, 46, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid var(--cyber-blue);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 0 40px rgba(0, 217, 255, 0.3);
            animation: fadeInUp 0.6s ease-out
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 40px
        }

        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--cyber-blue), var(--cyber-purple), var(--cyber-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px
        }

        .logo-subtitle {
            font-size: 0.9rem;
            color: var(--cyber-blue);
            letter-spacing: 0.2em;
            text-transform: uppercase
        }

        .role-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px
        }

        .role-btn {
            flex: 1;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 217, 255, 0.3);
            border-radius: 10px;
            color: rgba(232, 244, 248, 0.7);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center
        }

        .role-btn:hover {
            border-color: var(--cyber-blue);
            color: var(--cyber-blue)
        }

        .role-btn.active {
            background: linear-gradient(135deg, var(--cyber-blue), var(--cyber-purple));
            border-color: transparent;
            color: var(--cyber-black);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.5)
        }

        .form-group {
            margin-bottom: 25px
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--cyber-blue);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em
        }

        .form-input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 217, 255, 0.3);
            border-radius: 10px;
            color: var(--cyber-white);
            font-size: 1rem;
            font-family: 'Red Hat Display', sans-serif;
            transition: all 0.3s ease
        }

        .form-input:focus {
            outline: none;
            border-color: var(--cyber-blue);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.3);
            background: rgba(0, 0, 0, 0.5)
        }

        .form-input::placeholder {
            color: rgba(232, 244, 248, 0.4)
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.9rem
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer
        }

        .forgot-link {
            color: var(--cyber-blue);
            text-decoration: none;
            transition: color 0.3s
        }

        .forgot-link:hover {
            color: var(--cyber-purple)
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--cyber-blue), var(--cyber-purple));
            border: none;
            border-radius: 10px;
            color: var(--cyber-black);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3)
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.6)
        }

        .demo-credentials {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 10px
        }

        .demo-credentials h4 {
            color: var(--cyber-green);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em
        }

        .demo-credentials p {
            font-size: 0.85rem;
            margin: 5px 0;
            color: rgba(232, 244, 248, 0.8)
        }

        .demo-credentials strong {
            color: var(--cyber-green)
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem
        }

        .register-link a {
            color: var(--cyber-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s
        }

        .register-link a:hover {
            color: var(--cyber-purple)
        }

        .error-message {
            background: rgba(255, 0, 85, 0.2);
            border: 1px solid var(--cyber-red);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            color: var(--cyber-red);
            font-size: 0.9rem;
            display: none
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s ease
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-10px)
            }

            75% {
                transform: translateX(10px)
            }
        }

        .back-home {
            text-align: center;
            margin-top: 20px
        }

        .back-home a {
            color: rgba(232, 244, 248, 0.6);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s
        }

        .back-home a:hover {
            color: var(--cyber-blue)
        }

        @media(max-width:768px) {
            .login-card {
                padding: 40px 30px
            }

            .logo-title {
                font-size: 2rem
            }

            .role-selector {
                flex-direction: column
            }
        }
    </style>
</head>

<body>
    <div class="cyber-grid"></div>
    <div class="scanlines"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <h1 class="logo-title">PHISHGUARD</h1>
                <p class="logo-subtitle">Security Training System</p>
            </div>

            <div class="error-message" id="errorMessage">
                Invalid credentials. Please try again.
            </div>

            <div class="role-selector">
                <button class="role-btn active" id="adminBtn" onclick="selectRole('admin')">Admin</button>
                <button class="role-btn" id="employeeBtn" onclick="selectRole('employee')">Employee</button>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <div class="demo-credentials">
                <h4>🔐 Demo Credentials</h4>
                <p><strong>Admin:</strong> admin@phishguard.com / admin123</p>
                <p><strong>Employee:</strong> employee@phishguard.com / emp123</p>
            </div>

            <div class="register-link">
                Don't have an account? <a href="register.html">Sign up here</a>
            </div>

            <div class="back-home">
                <a href="index.html">← Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        var selectedRole = 'admin';

        function selectRole(role) {
            selectedRole = role;
            document.getElementById('adminBtn').classList.remove('active');
            document.getElementById('employeeBtn').classList.remove('active');

            if (role === 'admin') {
                document.getElementById('adminBtn').classList.add('active');
            } else {
                document.getElementById('employeeBtn').classList.add('active');
            }

            hideError();
        }

        async function handleLogin(event) {
            event.preventDefault();

            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;

            try {
                const res = await fetch("http://localhost:5000/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (data.message.includes("Successful")) {
                    
                    if (data.user.role !== selectedRole) {
                        document.getElementById('errorMessage').innerHTML = "Cannot login: Role mismatch ❌";
                        showError();
                        return;
                    }

                    // store user data and token
                    localStorage.setItem("user", JSON.stringify(data.user));
                    localStorage.setItem("phishguard_token", data.token);

                    // role-based redirect
                    if (data.user.role === "admin") {
                        window.location.href = "admin-dashboard.html";
                    } else {
                        window.location.href = "employee-dashboard.html";
                    }

                } else {
                    document.getElementById('errorMessage').innerHTML = "Invalid credentials. Please try again.";
                    showError();
                }

            } catch (error) {
                console.error(error);
                document.getElementById('errorMessage').innerHTML = "Server error ❌";
                showError();
            }
        }

        function showError() {
            var errorMsg = document.getElementById('errorMessage');
            errorMsg.classList.add('show');
            setTimeout(function () { hideError(); }, 3000);
        }

        function hideError() {
            var errorMsg = document.getElementById('errorMessage');
            errorMsg.classList.remove('show');
        }

        window.onload = function () {
            var user = localStorage.getItem('user');
            var token = localStorage.getItem('phishguard_token');

            if (user && token) {
                user = JSON.parse(user);

                if (user.role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'employee-dashboard.html';
                }
            }
        };
    </script>
</body>

</html>
