<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --pg-bg: #0d1117; --pg-surface: #161b22; --pg-border: #21262d;
        --pg-cyan: #00e5c8; --pg-text: #e6edf3; --pg-muted: #7d8590;
        --pg-red: #f85149; --pg-green: #3fb950; --pg-purple: #7c3aed;
        --font-sans: system-ui, -apple-system, sans-serif;
    }
    body {
        background: var(--pg-bg); color: var(--pg-text);
        font-family: var(--font-sans); min-height: 100vh;
        display: flex; flex-direction: column;
    }
    .topbar {
        padding: 18px 24px; border-bottom: 1px solid var(--pg-border);
        display: flex; align-items: center; justify-content: space-between;
        background: var(--pg-surface);
    }
    .topbar-left h1 { font-size: 20px; font-weight: 500; color: var(--pg-purple); }
    .topbar-left p { font-size: 13px; color: var(--pg-muted); margin-top: 4px; }
    .btn-back {
        background: transparent; border: 1px solid var(--pg-border);
        color: var(--pg-text); padding: 8px 16px; border-radius: 6px;
        cursor: pointer; font-size: 13px; text-decoration: none;
    }

    .main-content {
        flex: 1; display: flex; flex-direction: column; align-items: center;
        padding: 40px 20px; max-width: 800px; margin: 0 auto; width: 100%;
    }

    .chat-container {
        width: 100%; flex: 1; background: var(--pg-surface);
        border: 1px solid var(--pg-border); border-radius: 12px;
        display: flex; flex-direction: column; overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 24px;
    }

    .chat-header {
        padding: 16px; border-bottom: 1px solid var(--pg-border);
        display: flex; align-items: center; gap: 12px; background: #0d1117;
    }

    .avatar {
        width: 36px; height: 36px; border-radius: 50%;
        background: var(--pg-purple); display: flex; align-items: center;
        justify-content: center; font-weight: bold; color: white;
    }

    .chat-user-info .name { font-weight: 500; font-size: 15px; }
    .chat-user-info .status { font-size: 12px; color: var(--pg-green); display: flex; align-items: center; gap: 4px;}
    .status-dot { width: 8px; height: 8px; background: var(--pg-green); border-radius: 50%; }

    .chat-messages {
        flex: 1; padding: 20px; overflow-y: auto; display: flex;
        flex-direction: column; gap: 16px;
    }

    .msg { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
    .msg-them { background: #21262d; align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg-me { background: rgba(124, 58, 237, 0.2); border: 1px solid rgba(124, 58, 237, 0.4); align-self: flex-end; border-bottom-right-radius: 4px; }
    
    .msg-system {
        align-self: center; background: transparent; color: var(--pg-muted);
        font-size: 12px; text-align: center; max-width: 100%;
    }

    .typing {
        display: none; align-self: flex-start; padding: 12px 16px;
        background: #21262d; border-radius: 12px; border-bottom-left-radius: 4px;
        gap: 4px; align-items: center;
    }
    .typing.active { display: flex; }
    .dot { width: 6px; height: 6px; background: var(--pg-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    .chat-input-area {
        padding: 16px; border-top: 1px solid var(--pg-border);
        background: #0d1117;
    }

    .choices-grid {
        display: grid; grid-template-columns: 1fr; gap: 10px;
    }

    .choice-btn {
        background: var(--pg-surface); border: 1px solid var(--pg-border);
        color: var(--pg-text); padding: 12px 16px; border-radius: 8px;
        cursor: pointer; font-size: 14px; text-align: left; transition: all 0.2s;
    }
    .choice-btn:hover { background: rgba(255,255,255,0.05); border-color: var(--pg-purple); }

</style>

<div class="topbar">
    <div class="topbar-left">
        <h1>Social Engineering IQ</h1>
        <p>A "colleague" is messaging you. Choose your responses carefully.</p>
    </div>
    <a href="gamified_training.html" class="btn-back">← Back to Dashboard</a>
</div>

<div class="main-content">
    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar">R</div>
            <div class="chat-user-info">
                <div class="name">Ravi Kumar (IT Operations)</div>
                <div class="status"><div class="status-dot"></div> Online</div>
            </div>
        </div>
        <div class="chat-messages" id="chatWindow">
            <div class="msg-system">Chat started today at 10:41 AM</div>
            <!-- Messages added via JS -->
            <div class="typing" id="typingIndicator">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div>
        <div class="chat-input-area" id="inputArea">
            <div class="choices-grid" id="choicesGrid">
                <!-- Choices added via JS -->
            </div>
        </div>
    </div>
</div>

<script>
    const story = {
        start: {
            msg: "Hey! It's Ravi from IT. Are you at your desk?",
            choices: [
                { text: "Yes, what's up?", next: "node2" },
                { text: "Who is this?", next: "node2" }
            ]
        },
        node2: {
            msg: "We're seeing some anomalous logins from your account in Russia. I need to verify your session immediately before the system locks you out.",
            choices: [
                { text: "Oh wow, okay. What do you need me to do?", next: "node3_fail" },
                { text: "Can you send an official ticket to my email first?", next: "node3_safe" },
                { text: "I'll call the IT extension directly to verify.", next: "node3_win" }
            ]
        },
        node3_fail: {
            msg: "Just click this secure link [internal-it.verify-now.com] and sign in to confirm you are the owner. Hurry!",
            choices: [
                { text: "Clicking it now...", next: "end_fail" },
                { text: "Wait, that URL looks suspicious. I'm reporting this.", next: "node3_win" }
            ]
        },
        node3_safe: {
            msg: "There's no time for a ticket, the automated lockout triggers in 60 seconds if you don't verify right now via this link: [internal-it.verify-now.com]",
            choices: [
                { text: "Okay, doing it now.", next: "end_fail" },
                { text: "No ticket, no action. I'm calling the helpdesk.", next: "node3_win" }
            ]
        },
        node3_win: {
            msg: "Please don't call, it will just delay the process. Just use the link!",
            choices: [
                { text: "[Block User and Report to Security]", next: "end_win" }
            ]
        },
        end_fail: {
            msg: "SYSTEM COMPROMISED. \n\nLearning Point: IT will never rush you, threaten immediate lockout without notice, or ask you to log in to an unverified third-party link. That creates a false sense of urgency.",
            choices: []
        },
        end_win: {
            msg: "THREAT NEUTRALIZED! \n\nGreat job! You recognized the artificial urgency and verified out-of-band (by calling the known IT number). +500 XP.",
            choices: []
        }
    };

    const chatWindow = document.getElementById('chatWindow');
    const typingIndicator = document.getElementById('typingIndicator');
    const choicesGrid = document.getElementById('choicesGrid');

    function appendMessage(text, isMe, isSystem = false) {
        typingIndicator.classList.remove('active');
        const div = document.createElement('div');
        div.className = isSystem ? 'msg-system' : (isMe ? 'msg msg-me' : 'msg msg-them');
        div.innerText = text;
        chatWindow.insertBefore(div, typingIndicator);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function showTyping(delay) {
        return new Promise(resolve => {
            typingIndicator.classList.add('active');
            chatWindow.scrollTop = chatWindow.scrollHeight;
            setTimeout(() => {
                typingIndicator.classList.remove('active');
                resolve();
            }, delay);
        });
    }

    async function finishModule(xpEarned) {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));
        if (token && user) {
            try {
                await fetch(`http://localhost:5000/employee/${user.email}/gamified-complete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ moduleId: 'social', xpEarned: xpEarned, passed: xpEarned > 0 })
                });
            } catch (e) {
                console.error(e);
            }
        }
    }

    async function renderChoices(choices, isEnd = false, won = false) {
        choicesGrid.innerHTML = '';
        if (choices.length === 0 || isEnd) {
            const xp = won ? 500 : 0;
            choicesGrid.innerHTML = `<div style="text-align:center; color: var(--pg-cyan); font-size: 14px; padding: 10px;">Simulation Complete. Saving progress...</div>`;
            await finishModule(xp);
            setTimeout(() => {
                window.location.href = 'gamified_training.html';
            }, 2000);
            return;
        }
        choices.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = c.text;
            btn.onclick = () => handleChoice(c);
            choicesGrid.appendChild(btn);
        });
    }

    async function handleChoice(choice) {
        choicesGrid.innerHTML = ''; // disable input
        appendMessage(choice.text, true);
        
        await showTyping(1500 + Math.random() * 1000); // 1.5 to 2.5 seconds thinking
        
        const nextNode = story[choice.next];
        const isEnd = choice.next.startsWith('end');
        const won = choice.next === 'end_win';

        if (isEnd) {
            appendMessage(nextNode.msg, false, true);
        } else {
            appendMessage(nextNode.msg, false);
        }
        
        renderChoices(nextNode.choices, isEnd, won);
    }

    // Start
    setTimeout(async () => {
        await showTyping(1500);
        appendMessage(story.start.msg, false);
        renderChoices(story.start.choices);
    }, 1000);

</script>
