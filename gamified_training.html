<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal - PhishGuard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Red+Hat+Display:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cyber-black: #0a0e17;
            --cyber-panel: #1a1f2e;
            --cyber-blue: #00d9ff;
            --cyber-red: #ff0055;
            --cyber-purple: #9945ff;
            --cyber-green: #00ff88;
            --cyber-white: #e8f4f8;
        }

        body {
            font-family: 'Red Hat Display', sans-serif;
            background: linear-gradient(120deg, #0a0e17 0%, #141a29 100%);
            color: var(--cyber-white);
            min-height: 100vh;
            display: flex;
        }

        body:before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: move 20s linear infinite;
            z-index: 0;
        }

        @keyframes move {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(50px);
            }
        }

        .sidebar {
            width: 260px;
            background: rgba(10, 14, 23, 0.92);
            border-right: 1px solid rgba(0, 217, 255, 0.2);
            padding: 28px 16px;
            position: relative;
            z-index: 2;
        }

        .brand {
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .brand h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            background: linear-gradient(135deg, var(--cyber-blue), var(--cyber-green));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand p {
            margin-top: 6px;
            font-size: 0.8rem;
            color: rgba(232, 244, 248, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu button {
            border: 1px solid rgba(0, 217, 255, 0.2);
            background: rgba(26, 31, 46, 0.7);
            color: var(--cyber-white);
            padding: 13px 14px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.83rem;
            letter-spacing: 0.06em;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s;
        }

        .menu button:hover,
        .menu button.active {
            border-color: var(--cyber-blue);
            transform: translateX(4px);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
        }

        .menu button.logout {
            margin-top: 20px;
            border-color: rgba(255, 0, 85, 0.4);
            color: #ffdce8;
        }

        .menu button.logout:hover {
            border-color: var(--cyber-red);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.25);
        }

        .main {
            flex: 1;
            padding: 40px;
            position: relative;
            z-index: 2;
            overflow-y: auto;
            height: 100vh;
        }

        .header {
            text-align: left;
            margin-bottom: 40px;
        }

        .header h1 {
            font-family: 'Orbitron';
            font-size: 3rem;
            background: linear-gradient(135deg, var(--cyber-blue), var(--cyber-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .header p {
            color: rgba(232, 244, 248, 0.7);
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(26, 31, 46, 0.6);
            border: 2px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            transition: 0.3s;
            text-align: center;
        }

        .stat-card:hover {
            border-color: var(--cyber-blue);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.4);
            transform: translateY(-5px);
        }

        .stat {
            font-size: 2rem;
            font-family: 'Orbitron';
            color: var(--cyber-blue);
        }

        .modules-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .module-item {
            background: rgba(26, 31, 46, 0.8);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            transition: 0.3s;
            padding: 24px;
        }

        .module-item:hover {
            border-color: var(--cyber-blue);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.1);
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .module-header h3 {
            font-family: 'Orbitron';
            color: var(--cyber-green);
            font-size: 1.4rem;
        }

        .module-status {
            font-family: 'Orbitron';
            color: #ccc;
            font-size: 0.9rem;
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 14, 23, 0.6);
            padding: 14px 20px;
            border-radius: 8px;
            border-left: 4px solid var(--cyber-blue);
        }

        .task-row.completed {
            border-left-color: var(--cyber-green);
            opacity: 0.8;
        }

        .task-name {
            font-weight: bold;
            color: var(--cyber-white);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .task-xp {
            color: var(--cyber-blue);
            font-family: 'Orbitron';
            font-size: 0.85rem;
        }

        .btn-start {
            background: transparent;
            border: 1px solid var(--cyber-blue);
            color: var(--cyber-blue);
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Orbitron';
            transition: 0.3s;
        }

        .btn-start:hover {
            background: var(--cyber-blue);
            color: var(--cyber-black);
            box-shadow: 0 0 10px var(--cyber-blue);
        }

        .btn-start:disabled {
            background: transparent;
            border-color: gray;
            color: gray;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-start.completed-btn {
            border-color: var(--cyber-green);
            color: var(--cyber-green);
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div class="brand">
            <h1>PHISHGUARD</h1>
            <p>Employee Portal</p>
        </div>
        <nav class="menu">
            <button onclick="window.location.href='employee-dashboard.html'">Overview</button>
            <button class="active">Training Lab</button>
            <button onclick="window.location.href='employee-dashboard.html'">Simulations</button>
            <button class="logout" onclick="logout()">Logout</button>
        </nav>
    </aside>

    <main class="main">
        <div class="header">
            <h1>TRAINING LAB</h1>
            <p>Complete your required modules to improve organizational security</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat" id="uiRisk">--</div>
                <p>Current Risk Score</p>
            </div>
            <div class="stat-card">
                <div class="stat" id="uiModulesDone">0/3</div>
                <p>Modules Finished</p>
            </div>
            <div class="stat-card">
                <div class="stat" id="uiTotalXp">0</div>
                <p>Total XP</p>
            </div>
        </div>

        <h2 style="margin: 0 0 20px; font-family:Orbitron; color: var(--cyber-white);">Required Modules (3)</h2>
        <div class="modules-grid" id="modulesContainer">
            <!-- Rendered by JS -->
            <p style="color:var(--cyber-blue)">Loading modules...</p>
        </div>
    </main>

    <script>
        // const videos = {
        //     email: {
        //         title: "Email Phishing Awareness",
        //         url: "https://www.youtube.com/embed/hv9vDrtdQHM"
        //     },
        //     social: {
        //         title: "Social Media Phishing",
        //         url: "https://www.youtube.com/embed/Rm9d3C9YzaM"
        //     },
        //     financial: {
        //         title: "Financial Scam Awareness",
        //         url: "https://www.youtube.com/embed/XBkzBrXlle0"
        //     }
        // };

        const videos = {
            email: {
                title: "Email Phishing Awareness",
                url: "https://www.youtube.com/embed/a2cTpJa50ic"
            },
            social: {
                title: "Social Media Phishing",
                url: "https://www.youtube.com/embed/Y7zNlEMDmI4"
            },
            financial: {
                title: "Financial Scam Awareness",
                url: "https://www.youtube.com/embed/6G2k7c4R3fM"
            }
        };

        function logout() {
            localStorage.removeItem('phishguard_token');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        async function loadModules() {
            const token = localStorage.getItem('phishguard_token');
            const user = JSON.parse(localStorage.getItem('user'));
            if (!token || !user) {
                window.location.href = 'index.html';
                return;
            }

            try {
                // Fetch user data for stats
                const uRes = await fetch("http://localhost:5000/employee/" + user.email, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const uData = await uRes.json();

                const riskDiv = document.getElementById('uiRisk');
                const risk = uData.riskScore || 0;
                riskDiv.textContent = risk;

                if (risk <= 30) riskDiv.style.color = 'var(--cyber-green)';
                else if (risk <= 60) riskDiv.style.color = 'yellow';
                else riskDiv.style.color = 'var(--cyber-red)';

                document.getElementById('uiTotalXp').textContent = uData.xp || 0;

                // Fetch modules
                const mRes = await fetch(`http://localhost:5000/employee/${user.email}/modules`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const mData = await mRes.json();

                const modules = mData.modules || [];
                const container = document.getElementById('modulesContainer');
                container.innerHTML = '';

                let totalModulesCompleted = 0;

                modules.forEach(mod => {
                    let totalTasks = mod.tasks.length;
                    let completedTasks = mod.tasks.filter(t => t.completed).length;

                    if (totalTasks > 0 && completedTasks === totalTasks) {
                        totalModulesCompleted++;
                    }

                    const card = document.createElement('div');
                    card.className = 'module-item';

                    let lockedCSS = mod.enabled ? '' : 'opacity: 0.5; pointer-events: none; filter: grayscale(100%); position: relative;';
                    let lockTag = mod.enabled ? '' : '<span style="position:absolute; top:20px; right:20px; background:rgba(255,0,85,0.2); border: 1px solid var(--cyber-red); color:var(--cyber-white); padding:4px 8px; border-radius:4px; font-size:0.8rem; font-family:\'Orbitron\'">🔒 LOCKED</span>';

                    card.style.cssText = lockedCSS;

                    let tasksHTML = '';
                    mod.tasks.forEach(task => {
                        const isDone = task.completed;
                        const icon = isDone ? '✅' : '⏳';

                        // Action logic - strictly UI representation right now
                        const btnText = isDone ? 'Done' : 'Complete Task';
                        const btnClass = isDone ? 'btn-start completed-btn' : 'btn-start';
                        const btnDisabled = isDone ? 'disabled' : '';

                        let onClickAction = `completeTask('${mod.moduleId}', '${task.type}')`;
                        if (task.type === 'video') onClickAction = `openVideo('${mod.moduleId.split('_')[0]}', '${mod.moduleId}', '${task.type}')`;
                        if (task.type === 'quiz') onClickAction = `openQuiz('${mod.moduleId.split('_')[0]}', '${mod.moduleId}', '${task.type}')`;
                        if (task.type === 'simulation') onClickAction = `openSimulation('${mod.moduleId.split('_')[0]}', '${mod.moduleId}', '${task.type}')`;

                        tasksHTML += `
                            <div class="task-row ${isDone ? 'completed' : ''}">
                                <div>
                                    <div class="task-name">${icon} ${task.name}</div>
                                    <div class="task-xp">Dynamic XP</div>
                                </div>
                                <button class="${btnClass}" ${btnDisabled} onclick="${onClickAction}">${btnText}</button>
                            </div>
                        `;
                    });

                    card.innerHTML = `
                        ${lockTag}
                        <div class="module-header">
                            <h3>${mod.title}</h3>
                            <div class="module-status">${completedTasks}/${totalTasks} Tasks</div>
                        </div>
                        <div class="tasks-list">
                            ${tasksHTML}
                        </div>
                    `;
                    container.appendChild(card);
                });

                document.getElementById('uiModulesDone').textContent = `${totalModulesCompleted}/3`;

            } catch (err) {
                console.error("Error loading modules", err);
                document.getElementById('modulesContainer').innerHTML = `<p style="color:red">Failed to connect to server.</p>`;
            }
        }

        /* --- VIDEO LOGIC --- */
        let videoWatchProgress = 0;
        let videoInterval;

        function openVideo(category, moduleId, taskType) {
            const video = videos[category] || videos['email'];
            const container = document.getElementById("modulesContainer");

            videoWatchProgress = 0;
            videoInterval = setInterval(() => { videoWatchProgress++ }, 1000);

            container.innerHTML = `
            <div style="background:#111; padding:20px; border-radius:10px;">
                <h2>${video.title}</h2>
                <iframe width="100%" height="400" src="${video.url}" frameborder="0" allowfullscreen></iframe>
                <br><br>
                <div style="display:flex; gap:10px;">
                    <button class="btn-start" onclick="markVideoDone('${moduleId}', '${taskType}')">Finish Video (+50 XP)</button>
                    <button class="btn-start" style="background: rgba(255, 0, 85, 0.1); color: var(--cyber-red); border: 1px solid var(--cyber-red);" onclick="skipVideo('${moduleId}', '${taskType}')">Skip Video (+0 XP)</button>
                </div>
                <br><br><button onclick="clearInterval(videoInterval); loadModules()">⬅ Back</button>
            </div>`;
        }

        function markVideoDone(moduleId, taskType) {
            clearInterval(videoInterval);
            completeTask(moduleId, taskType, 50);
        }

        function skipVideo(moduleId, taskType) {
            clearInterval(videoInterval);
            completeTask(moduleId, taskType, 0);
        }

        /* --- SIMULATION LOGIC --- */
        let currentSimQuestions = [];
        let currentSimIndex = 0;
        let currentSimScore = 0;

        async function openSimulation(category, moduleId, taskType) {
            const token = localStorage.getItem('phishguard_token');
            const res = await fetch(`http://localhost:5000/api/simulation/${category}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const sims = await res.json();

            if (!sims || sims.length === 0) {
                alert("No simulations found for this category! Contact Admin.");
                return;
            }

            currentSimQuestions = sims;
            currentSimIndex = 0;
            currentSimScore = 0;
            renderSimStep(moduleId, taskType);
        }

        function renderSimStep(moduleId, taskType) {
            const container = document.getElementById("modulesContainer");
            
            if (currentSimIndex >= currentSimQuestions.length) {
                let percent = (currentSimScore / currentSimQuestions.length) * 100;
                let earnedXp = 20;
                if (percent >= 80) earnedXp = 100;
                else if (percent >= 50) earnedXp = 50;

                container.innerHTML = `
                <div style="background:#111; padding:30px; border-radius:10px; text-align: center;">
                    <h2>Simulation Sandbox Completed!</h2>
                    <p style="font-size: 1.2rem; margin: 15px 0;">You successfully mitigated ${currentSimScore} out of ${currentSimQuestions.length} threats (${Math.round(percent)}%).</p>
                    <p style="color: var(--cyber-green); margin-bottom: 20px; font-weight: bold; font-size: 1.1rem;">You earned +${earnedXp} XP!</p>
                    <button class="btn-start" onclick="completeTask('${moduleId}', '${taskType}', ${earnedXp})">Finish & Save</button>
                </div>`;
                return;
            }
            
            const sim = currentSimQuestions[currentSimIndex];

            container.innerHTML = `
            <div style="background:#111; padding:20px; border-radius:10px;">
                <h3 style="color: var(--cyber-yellow); margin-bottom: 10px; font-family:'Orbitron', sans-serif;">Simulation Sandbox (${currentSimIndex + 1}/${currentSimQuestions.length})</h3>
                <h2 style="margin-bottom: 20px;">${sim.title}</h2>
                <div style="padding: 15px; margin: 15px 0; background: rgba(0, 217, 255, 0.1); border-left: 4px solid var(--cyber-blue); line-height: 1.6; font-style: italic;">
                    "${sim.emailContent}"
                </div>
                <h3 style="margin-bottom: 15px;">${sim.question}</h3>
                <div id="options"></div>
                <br><button onclick="loadModules()">⬅ Exit Early</button>
            </div>`;

            const optionsDiv = document.getElementById("options");

            sim.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.style.cssText = "display:block; width:100%; text-align:left; margin-bottom: 10px; padding: 12px; background: rgba(0, 217, 255, 0.05); border: 1px solid var(--cyber-blue); color: #fff; cursor: pointer; border-radius: 6px; transition: 0.2s;";
                btn.onmouseover = () => { btn.style.background = 'var(--cyber-blue)'; btn.style.color = '#000'; };
                btn.onmouseout = () => { btn.style.background = 'rgba(0, 217, 255, 0.05)'; btn.style.color = '#fff'; };
                btn.onclick = () => checkSimulationAnswer(index, sim.answer, moduleId, taskType);

                optionsDiv.appendChild(btn);
            });
        }

        function checkSimulationAnswer(selectedIndex, correctIndex, moduleId, taskType) {
            const container = document.getElementById("modulesContainer");

            let resultMessage = "";
            let color = "";
            let resultTitle = "";

            if (selectedIndex === correctIndex) {
                currentSimScore++;
                resultTitle = "Correct! 🛡️";
                resultMessage = "Great job identifying the red flags. You successfully mitigated the phishing attempt.";
                color = "var(--cyber-green)";
            } else {
                resultTitle = "Compromised! ❌";
                resultMessage = "You fell for the simulation. Always verify links and urgent requests before acting.";
                color = "var(--cyber-red)";
            }

            container.innerHTML = `
            <div style="background:#111; padding:30px; border-radius:10px; text-align: center;">
                <h2 style="color: ${color}">${resultTitle}</h2>
                <p style="margin: 20px 0; font-size: 1.1rem; line-height: 1.5;">${resultMessage}</p>
                <button class="btn-start" onclick="currentSimIndex++; renderSimStep('${moduleId}', '${taskType}')">Next Scenario ➡</button>
            </div>`;
        }

        /* --- QUIZ LOGIC --- */
        let currentQuizQuestions = [];
        let currentQuizScore = 0;
        let currentQuizIndex = 0;

        async function openQuiz(category, moduleId, taskType) {
            try {
                const token = localStorage.getItem('phishguard_token');
                const res = await fetch(`http://localhost:5000/quiz/${category}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                currentQuizQuestions = await res.json();

                if (!currentQuizQuestions || currentQuizQuestions.length === 0) {
                    alert("No quiz questions found for this category! Contact Admin.");
                    return;
                }

                currentQuizScore = 0;
                currentQuizIndex = 0;
                renderQuizStep(moduleId, taskType);
            } catch (err) {
                console.error("Quiz load error:", err);
            }
        }

        function renderQuizStep(moduleId, taskType) {
            const container = document.getElementById("modulesContainer");
            if (currentQuizIndex >= currentQuizQuestions.length) {
                let percent = (currentQuizScore / currentQuizQuestions.length) * 100;
                let earnedXp = 10;
                if (percent >= 80) earnedXp = 50;
                else if (percent >= 50) earnedXp = 30;

                container.innerHTML = `
                <div style="background:#111; padding:30px; border-radius:10px; text-align: center;">
                    <h2>Quiz Completed!</h2>
                    <p style="font-size: 1.2rem; margin: 15px 0;">You scored ${currentQuizScore} out of ${currentQuizQuestions.length} (${Math.round(percent)}%).</p>
                    <p style="color: var(--cyber-green); margin-bottom: 20px; font-weight: bold; font-size: 1.1rem;">You earned +${earnedXp} XP!</p>
                    <button class="btn-start" onclick="completeTask('${moduleId}', '${taskType}', ${earnedXp})">Save Result</button>
                </div>`;
                return;
            }

            const q = currentQuizQuestions[currentQuizIndex];
            let optionsHTML = '';
            q.options.forEach((opt, index) => {
                optionsHTML += `<button style="display:block; width:100%; text-align:left; margin-bottom: 10px; padding: 12px; background: rgba(0, 217, 255, 0.05); border: 1px solid var(--cyber-blue); color: #fff; cursor: pointer; border-radius: 6px; transition: 0.2s;" onmouseover="this.style.background='var(--cyber-blue)'; this.style.color='#000';" onmouseout="this.style.background='rgba(0, 217, 255, 0.05)'; this.style.color='#fff';" onclick="checkAnswer(${index}, ${q.answer}, '${moduleId}', '${taskType}')">${opt}</button>`;
            });

            container.innerHTML = `
            <div style="background:#111; padding:20px; border-radius:10px;">
                <h3 style="color: var(--cyber-yellow); margin-bottom: 10px; font-family:'Orbitron', sans-serif;">Question ${currentQuizIndex + 1} of ${currentQuizQuestions.length}</h3>
                <p style="font-size: 0.9rem; color: #888; margin-bottom: 15px;">${q.scenario || ''}</p>
                <h2 style="margin-bottom: 20px;">${q.question}</h2>
                <div>${optionsHTML}</div>
                <br><br><button onclick="loadModules()">⬅ Exit Quiz Early</button>
            </div>`;
        }

        function checkAnswer(selectedIndex, correctIndex, moduleId, taskType) {
            if (selectedIndex === correctIndex) {
                currentQuizScore++;
            }
            currentQuizIndex++;
            renderQuizStep(moduleId, taskType);
        }

        /* --- API COMPLETION ROUTER --- */
        async function completeTask(moduleId, taskType, earnedXp) {
            const token = localStorage.getItem('phishguard_token');
            const user = JSON.parse(localStorage.getItem('user'));

            try {
                const res = await fetch(`http://localhost:5000/employee/${user.email}/complete-task`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ moduleId, taskType, earnedXp })
                });
                const data = await res.json();

                if (data.xp !== undefined) {
                    loadModules();
                }
            } catch (err) {
                console.error(err);
            }
        }

        window.onload = loadModules;
    </script>
</body>

</html>
