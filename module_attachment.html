<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --pg-bg: #0d1117; --pg-surface: #161b22; --pg-border: #21262d;
        --pg-cyan: #00e5c8; --pg-text: #e6edf3; --pg-muted: #7d8590;
        --pg-red: #f85149; --pg-green: #3fb950; --pg-amber: #d29922;
        --font-sans: system-ui, -apple-system, sans-serif;
    }
    body {
        background: var(--pg-bg); color: var(--pg-text);
        font-family: var(--font-sans); min-height: 100vh;
        display: flex; flex-direction: column; overflow: hidden;
    }
    .topbar {
        padding: 18px 24px; border-bottom: 1px solid var(--pg-border);
        display: flex; align-items: center; justify-content: space-between;
        background: var(--pg-surface); flex-shrink: 0;
    }
    .topbar-left h1 { font-size: 20px; font-weight: 500; color: var(--pg-red); }
    .topbar-left p { font-size: 13px; color: var(--pg-muted); margin-top: 4px; }
    .btn-back {
        background: transparent; border: 1px solid var(--pg-border);
        color: var(--pg-text); padding: 8px 16px; border-radius: 6px;
        cursor: pointer; font-size: 13px; text-decoration: none;
    }

    .main-content {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 20px;
    }

    .game-hud {
        display: flex; justify-content: space-between; width: 100%; max-width: 600px;
        margin-bottom: 30px; font-size: 18px; font-weight: 500;
    }
    .score-box { background: var(--pg-surface); border: 1px solid var(--pg-border); padding: 12px 20px; border-radius: 8px; text-align: center; }
    .score-val { color: var(--pg-cyan); font-size: 24px; }
    .streak-val { color: var(--pg-amber); }

    .scanner-zone {
        width: 100%; max-width: 600px; height: 350px;
        background: radial-gradient(circle at center, rgba(248,81,73,0.05) 0%, transparent 70%), var(--pg-surface);
        border: 2px dashed var(--pg-border); border-radius: 16px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        position: relative; overflow: hidden;
    }

    .file-card {
        background: #010409; border: 1px solid var(--pg-border);
        padding: 24px; border-radius: 12px; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10;
        transition: transform 0.3s;
    }

    .file-icon { font-size: 64px; }
    .file-name { font-size: 20px; font-weight: bold; font-family: monospace; letter-spacing: 0.5px; }
    .file-size { font-size: 13px; color: var(--pg-muted); }

    .timer-bar-container {
        width: 80%; height: 6px; background: var(--pg-border); border-radius: 3px;
        overflow: hidden; margin-top: 20px;
    }
    .timer-fill {
        height: 100%; width: 100%; background: var(--pg-cyan);
        transform-origin: left; transition: transform 0.1s linear, background-color 0.3s;
    }

    .action-row {
        display: flex; gap: 20px; margin-top: 40px;
    }

    .btn-action {
        width: 160px; padding: 16px; font-size: 18px; font-weight: bold;
        border-radius: 12px; cursor: pointer; text-transform: uppercase;
        letter-spacing: 1px; display: flex; align-items: center; justify-content: center;
        gap: 8px; border: none; color: white; transition: transform 0.1s, filter 0.2s;
    }
    .btn-action:active { transform: scale(0.95); }
    .btn-action:hover { filter: brightness(1.2); }

    .btn-approve { background: var(--pg-green); }
    .btn-quarantine { background: var(--pg-red); }

    .feedback-overlay {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 48px; font-weight: bold; opacity: 0; pointer-events: none;
        transition: opacity 0.2s; z-index: 20; background: rgba(13,17,23,0.8);
    }
    .overlay-green { color: var(--pg-green); text-shadow: 0 0 20px var(--pg-green); }
    .overlay-red { color: var(--pg-red); text-shadow: 0 0 20px var(--pg-red); }
</style>

<div class="topbar">
    <div class="topbar-left">
        <h1>Malicious Attachment Detector</h1>
        <p>You have 6 seconds per file. Scan the extensions carefully before approving!</p>
    </div>
    <a href="gamified_training.html" class="btn-back">← Back to Dashboard</a>
</div>

<div class="main-content">
    <div class="game-hud">
        <div class="score-box">
            <div style="font-size: 11px; color: var(--pg-muted); text-transform:uppercase;">XP Earned</div>
            <div class="score-val" id="xpEl">0</div>
        </div>
        <div class="score-box">
            <div style="font-size: 11px; color: var(--pg-muted); text-transform:uppercase;">Files Scanned</div>
            <div class="score-val" style="color:var(--pg-text)" id="countEl">0 / 8</div>
        </div>
        <div class="score-box">
            <div style="font-size: 11px; color: var(--pg-muted); text-transform:uppercase;">Combo Streak</div>
            <div class="score-val streak-val" id="streakEl">x1</div>
        </div>
    </div>

    <div class="scanner-zone">
        <div class="feedback-overlay" id="overlay">MATCH</div>
        
        <div class="file-card" id="fileCard">
            <div class="file-icon" id="fIcon">📄</div>
            <div class="file-name" id="fName">Loading...</div>
            <div class="file-size" id="fSize">-- KB</div>
            <div class="timer-bar-container">
                <div class="timer-fill" id="tFill"></div>
            </div>
        </div>
    </div>

    <div class="action-row">
        <button class="btn-action btn-approve" onclick="handleChoice(true)">✅ Approve</button>
        <button class="btn-action btn-quarantine" onclick="handleChoice(false)">☢ Quarantine</button>
    </div>
</div>

<script>
    const files = [
        { name: "Q3_Financial_Summary.pdf", icon: "📊", safe: true },
        { name: "invoice_OVERDUE.pdf.exe", icon: "📄", safe: false }, // Double extension hide
        { name: "employee_handbook.docx", icon: "📘", safe: true },
        { name: "urgent_wire_transfer.docm", icon: "📝", safe: false }, // Macro enabled
        { name: "meeting_notes.txt", icon: "🗒", safe: true },
        { name: "Setup_Installer.scr", icon: "⚙", safe: false }, // Screensaver executable
        { name: "Project_Proposal.pdf", icon: "📈", safe: true },
        { name: "Salary_Adjustments.xlsx.vbs", icon: "💵", safe: false } // VBScript
    ];

    let currentFileIdx = 0;
    let xp = 0;
    let streak = 0;
    let multiplier = 1;
    let timerInterval;
    let timeLeft = 6.0;
    const TIME_LIMIT = 6.0;
    let isProcessing = false;

    function startGame() {
        // shuffle array
        files.sort(() => Math.random() - 0.5);
        loadNextFile();
    }

    function loadNextFile() {
        if (currentFileIdx >= files.length) {
            endGame();
            return;
        }

        const file = files[currentFileIdx];
        document.getElementById('fIcon').textContent = file.icon;
        document.getElementById('fName').textContent = file.name;
        document.getElementById('fSize').textContent = Math.floor(Math.random() * 5000 + 100) + ' KB';
        document.getElementById('countEl').textContent = `${currentFileIdx} / ${files.length}`;
        
        timeLeft = TIME_LIMIT;
        document.getElementById('tFill').style.backgroundColor = 'var(--pg-cyan)';
        
        isProcessing = false;
        clearInterval(timerInterval);
        
        timerInterval = setInterval(() => {
            if(isProcessing) return;
            timeLeft -= 0.05;
            const pct = timeLeft / TIME_LIMIT;
            
            const fill = document.getElementById('tFill');
            fill.style.transform = `scaleX(${pct})`;
            
            if (pct < 0.3) fill.style.backgroundColor = 'var(--pg-red)';
            else if (pct < 0.6) fill.style.backgroundColor = 'var(--pg-amber)';
            
            if (timeLeft <= 0) {
                handleChoice(null); // Timeout
            }
        }, 50);
    }

    function handleChoice(approved) {
        if (isProcessing) return;
        isProcessing = true;
        clearInterval(timerInterval);

        const file = files[currentFileIdx];
        let correct = false;

        if (approved === null) {
            // Timeout
            showFeedback("TIME UP", false);
            streak = 0;
            multiplier = 1;
        } else {
            correct = (approved === file.safe);
            if (correct) {
                streak++;
                multiplier = Math.min(5, 1 + Math.floor(streak / 2)); 
                const earned = 50 * multiplier;
                xp += earned;
                showFeedback(`CORRECT +${earned}XP`, true);
            } else {
                streak = 0;
                multiplier = 1;
                xp = Math.max(0, xp - 20);
                showFeedback("WRONG ALARM!", false);
            }
        }

        updateHud();
        
        setTimeout(() => {
            currentFileIdx++;
            loadNextFile();
        }, 1200);
    }

    function showFeedback(text, isGood) {
        const overlay = document.getElementById('overlay');
        overlay.textContent = text;
        overlay.className = 'feedback-overlay ' + (isGood ? 'overlay-green' : 'overlay-red');
        overlay.style.opacity = '1';
        setTimeout(() => { overlay.style.opacity = '0'; }, 1000);
    }

    function updateHud() {
        document.getElementById('xpEl').textContent = xp;
        document.getElementById('streakEl').textContent = `x${multiplier} ` + '🔥'.repeat(multiplier - 1);
        if (multiplier === 1) document.getElementById('streakEl').style.color = 'var(--pg-text)';
        else if (multiplier >= 3) document.getElementById('streakEl').style.color = 'var(--pg-red)';
        else document.getElementById('streakEl').style.color = 'var(--pg-amber)';
    }

    async function finishModule(xpEarned) {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));
        if (token && user) {
            try {
                await fetch(`http://localhost:5000/employee/${user.email}/gamified-complete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ moduleId: 'attachment', xpEarned: xpEarned, passed: xpEarned > 0 })
                });
            } catch (e) {
                console.error(e);
            }
        }
    }

    async function endGame() {
        document.getElementById('countEl').textContent = `${files.length} / ${files.length}`;
        const scanner = document.querySelector('.scanner-zone');
        scanner.innerHTML = `
            <div style="font-size: 24px; color: var(--pg-green); margin-bottom: 20px;">Scanner Complete!</div>
            <div style="font-size: 18px; color: var(--pg-text);">Total XP Earned: ${xp}. Saving...</div>
        `;
        document.querySelector('.action-row').style.display = 'none';
        
        await finishModule(xp);
        setTimeout(() => {
            window.location.href = 'gamified_training.html';
        }, 2000);
    }

    startGame();
</script>
