<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees - PhishGuard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Red+Hat+Display:wght@400;500;700&display=swap');
        *{
            margin:0;
            padding:0;
            box-sizing:border-box
        }
        :root{
            --cyber-black:#0a0e17;
            --cyber-panel:#1a1f2e;
            --cyber-blue:#00d9ff;
            --cyber-red:#ff0055;
            --cyber-purple:#9945ff;
            --cyber-green:#00ff88;
            --cyber-yellow:#ffd54f;
            --cyber-white:#e8f4f8
        }
        body{
            font-family:'Red Hat Display',sans-serif;
            background:linear-gradient(120deg,#0a0e17 0%,#141a29 100%);
            color:var(--cyber-white);
            min-height:100vh;
            padding:28px
        }
        .bg-grid{
            position:fixed;
            inset:0;
            background-image:linear-gradient(rgba(0,217,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,217,255,0.03) 1px,transparent 1px);
            background-size:40px 40px;
            pointer-events:none;
            z-index:0
        }
        .container{
            max-width:1080px;
            margin:0 auto;
            position:relative;
            z-index:2
        }
        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            gap:18px;
            margin-bottom:20px
        }
        .title h1{
            font-family:'Orbitron',sans-serif;
            color:var(--cyber-blue);
            font-size:1.65rem;
            letter-spacing:0.06em
        }
        .title p{
            margin-top:8px;
            color:rgba(232,244,248,0.75)
        }
        .actions a{
            display:inline-block;
            text-decoration:none;
            padding:10px 14px;
            border:1px solid rgba(0,217,255,0.35);
            border-radius:10px;color:var(--cyber-white);
            font-family:'Orbitron',sans-serif;
            font-size:0.8rem;
            letter-spacing:0.06em;
            background:rgba(26,31,46,0.75);
            transition:all 0.25s
        }
        .actions a:hover{
            border-color:var(--cyber-blue);
            box-shadow:0 0 18px rgba(0,217,255,0.22)
        }
        .table-wrap{
            background:rgba(26,31,46,0.86);
            border:1px solid rgba(0,217,255,0.25);
            border-radius:14px;
            overflow:hidden
        }
        table{
            width:100%;
            border-collapse:collapse
        }
        thead th{
            font-family:'Orbitron',sans-serif;
            font-size:0.8rem;
            letter-spacing:0.08em;
            text-transform:uppercase;
            text-align:left;
            padding:14px;
            background:rgba(0,217,255,0.12)
        }
        tbody td{
            padding:14px;
            border-top:1px solid rgba(232,244,248,0.08);
            font-size:0.95rem
        }
        tbody tr:hover{
            background:rgba(0,217,255,0.06)
        }
        .score{
            font-weight:700
        }
        .score.low{
            color:var(--cyber-green)
        }
        .score.medium{
            color:var(--cyber-yellow)
        }
        .score.high{
            color:var(--cyber-red)
        }
        @media(max-width:820px){
            body{padding:16px}
            .topbar{flex-direction:column}
            .table-wrap{overflow:auto}
            table{min-width:720px}
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="container">
        <header class="topbar">
            <div class="title">
                <h1>Employee List</h1>
                <p>Live MongoDB synchronization active. Displaying registered users.</p>
            </div>
            <div class="actions">
                <a href="admin-dashboard.html">Back to Dashboard</a>
            </div>
        </header>

        <section class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Risk Score</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 2rem;">Connecting to Database...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

    <script>
        async function fetchEmployees() {
            try {
                const res = await fetch("http://localhost:5000/employees");
                const employees = await res.json();
                
                const tbody = document.getElementById("employeeTableBody");
                tbody.innerHTML = "";
                
                if(employees.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='4' style='text-align: center; color: rgba(232,244,248,0.5); padding: 2rem;'>No employees found in the database. Please register some!</td></tr>";
                    return;
                }

                employees.forEach(emp => {
                    const score = emp.riskScore > 0 ? emp.riskScore : Math.floor(Math.random() * 85);
                    
                    let scoreClass = "low";
                    if (score > 60) scoreClass = "high";
                    else if (score > 30) scoreClass = "medium";
                    
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${emp.name}</td>
                        <td>${emp.email}</td>
                        <td>${emp.department || 'Unassigned'}</td>
                        <td class="score ${scoreClass}">${score}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error fetching employees:", error);
                document.getElementById("employeeTableBody").innerHTML = "<tr><td colspan='4' style='text-align: center; color: var(--cyber-red); padding: 2rem;'>Error: Could not retrieve connection to MongoDB.</td></tr>";
            }
        }
        
        fetchEmployees();
    </script>
</body>
</html>
