<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees - PhishGuard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Red+Hat+Display:wght@400;500;700&display=swap');
        *{
            margin:0;
            padding:0;
            box-sizing:border-box
        }
        :root{
            --cyber-black:#0a0e17;
            --cyber-panel:#1a1f2e;
            --cyber-blue:#00d9ff;
            --cyber-red:#ff0055;
            --cyber-purple:#9945ff;
            --cyber-green:#00ff88;
            --cyber-yellow:#ffd54f;
            --cyber-white:#e8f4f8
        }
        body{
            font-family:'Red Hat Display',sans-serif;
            background:linear-gradient(120deg,#0a0e17 0%,#141a29 100%);
            color:var(--cyber-white);
            min-height:100vh;
            padding:28px
        }
        .bg-grid{
            position:fixed;
            inset:0;
            background-image:linear-gradient(rgba(0,217,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,217,255,0.03) 1px,transparent 1px);
            background-size:40px 40px;
            pointer-events:none;
            z-index:0
        }
        .container{
            max-width:1080px;
            margin:0 auto;
            position:relative;
            z-index:2
        }
        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            gap:18px;
            margin-bottom:20px
        }
        .title h1{
            font-family:'Orbitron',sans-serif;
            color:var(--cyber-blue);
            font-size:1.65rem;
            letter-spacing:0.06em
        }
        .title p{
            margin-top:8px;
            color:rgba(232,244,248,0.75)
        }
        .actions a{
            display:inline-block;
            text-decoration:none;
            padding:10px 14px;
            border:1px solid rgba(0,217,255,0.35);
            border-radius:10px;color:var(--cyber-white);
            font-family:'Orbitron',sans-serif;
            font-size:0.8rem;
            letter-spacing:0.06em;
            background:rgba(26,31,46,0.75);
            transition:all 0.25s
        }
        .actions a:hover{
            border-color:var(--cyber-blue);
            box-shadow:0 0 18px rgba(0,217,255,0.22)
        }
        .table-wrap{
            background:rgba(26,31,46,0.86);
            border:1px solid rgba(0,217,255,0.25);
            border-radius:14px;
            overflow:hidden
        }
        table{
            width:100%;
            border-collapse:collapse
        }
        thead th{
            font-family:'Orbitron',sans-serif;
            font-size:0.8rem;
            letter-spacing:0.08em;
            text-transform:uppercase;
            text-align:left;
            padding:14px;
            background:rgba(0,217,255,0.12)
        }
        tbody td{
            padding:14px;
            border-top:1px solid rgba(232,244,248,0.08);
            font-size:0.95rem
        }
        tbody tr:hover{
            background:rgba(0,217,255,0.06)
        }
        .score{
            font-weight:700
        }
        .score.low{
            color:var(--cyber-green)
        }
        .score.medium{
            color:var(--cyber-yellow)
        }
        .score.high{
            color:var(--cyber-red)
        }
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(10, 14, 23, 0.9); z-index: 100;
            justify-content: center; align-items: center; backdrop-filter: blur(4px);
        }
        .modal {
            background: rgba(26, 31, 46, 0.95); border: 1px solid var(--cyber-blue);
            border-radius: 14px; padding: 30px; width: 100%; max-width: 450px;
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.15);
        }
        .modal h2 { font-family: 'Orbitron', sans-serif; margin-bottom: 20px; color: var(--cyber-blue); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: rgba(232, 244, 248, 0.8); }
        .form-input {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(0, 217, 255, 0.3);
            background: rgba(10, 14, 23, 0.6); color: #fff; outline: none; transition: 0.3s;
        }
        .form-input:focus { border-color: var(--cyber-blue); box-shadow: 0 0 10px rgba(0, 217, 255, 0.2); }
        .modal-actions { display: flex; gap: 10px; margin-top: 25px; }
        .btn-primary, .btn-secondary, .btn-danger {
            flex: 1; padding: 12px; border: none; border-radius: 8px; font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .btn-primary { background: rgba(0, 217, 255, 0.15); border: 1px solid var(--cyber-blue); color: var(--cyber-blue); }
        .btn-primary:hover { background: var(--cyber-blue); color: #000; box-shadow: 0 0 15px var(--cyber-blue); }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); color: #ccc; border: 1px solid rgba(255,255,255,0.1); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .btn-danger { background: rgba(255, 0, 85, 0.1); border: 1px solid var(--cyber-red); color: var(--cyber-red); padding: 6px 12px; font-size: 0.75rem; border-radius: 6px; }
        .btn-danger:hover { background: var(--cyber-red); color: #fff; box-shadow: 0 0 10px var(--cyber-red); }

        @media(max-width:820px){
            body{padding:16px}
            .topbar{flex-direction:column}
            .table-wrap{overflow:auto}
            table{min-width:720px}
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="container">
        <header class="topbar">
            <div class="title">
                <h1>Employee List</h1>
                <p>Live MongoDB synchronization active. Displaying registered users.</p>
            </div>
            <div class="actions">
                <a href="#" onclick="openModal()" style="margin-right: 10px; color: var(--cyber-green); border-color: var(--cyber-green);">+ Add Employee</a>
                <a href="admin-dashboard.html">Back to Dashboard</a>
            </div>
        </header>

        <section class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Risk Score</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 2rem;">Connecting to Database...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

    <!-- ADD EMPLOYEE MODAL -->
    <div class="modal-overlay" id="addEmployeeModal">
        <div class="modal">
            <h2>Add New Employee</h2>
            <form id="addEmployeeForm" onsubmit="submitForm(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="empName" class="form-input" pattern="[A-Za-z\s]+" title="Name must contain only letters and spaces" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="empEmail" class="form-input" pattern="^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.(com|org|net|edu|gov|in|io)$" title="Please use a valid top-level domain. '.co' is not permitted." required>
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" id="empDept" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Default Password</label>
                    <input type="password" id="empPass" class="form-input" required minlength="6">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Create Employee</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("user"));
        const token = localStorage.getItem("phishguard_token");
        if (!user || user.role !== "admin" || !token) {
            window.location.href = "login.html";
        }
        
        async function fetchEmployees() {
            try {
                const res = await fetch("http://localhost:5000/employees", {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const employees = await res.json();
                
                const tbody = document.getElementById("employeeTableBody");
                tbody.innerHTML = "";
                
                if(employees.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='4' style='text-align: center; color: rgba(232,244,248,0.5); padding: 2rem;'>No employees found in the database. Please register some!</td></tr>";
                    return;
                }

                employees.forEach(emp => {
                    const score = emp.riskScore;
                    
                    let scoreClass = "low";
                    if (score > 60) scoreClass = "high";
                    else if (score > 30) scoreClass = "medium";
                    
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${emp.name}</td>
                        <td>${emp.email}</td>
                        <td>${emp.department || 'Unassigned'}</td>
                        <td class="score ${scoreClass}">${score}</td>
                        <td><button class="btn-danger" onclick="deleteEmployee('${emp._id}')">Delete</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error fetching employees:", error);
                document.getElementById("employeeTableBody").innerHTML = "<tr><td colspan='4' style='text-align: center; color: var(--cyber-red); padding: 2rem;'>Error: Could not connect to the Backend server. Ensure 'node server.js' and MongoDB are running.</td></tr>";
            }
        }
        
        fetchEmployees();
        setInterval(fetchEmployees, 5000);

        function openModal() {
            document.getElementById('addEmployeeModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('addEmployeeModal').style.display = 'none';
            document.getElementById('addEmployeeForm').reset();
        }

        async function submitForm(e) {
            e.preventDefault();
            const name = document.getElementById('empName').value;
            const email = document.getElementById('empEmail').value;
            const department = document.getElementById('empDept').value;
            const password = document.getElementById('empPass').value;

            try {
                const res = await fetch("http://localhost:5000/admin/employee", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ name, email, department, password })
                });
                
                const data = await res.json();
                if (res.ok) {
                    alert('Employee Added Successfully!');
                    closeModal();
                    fetchEmployees();
                } else {
                    alert(data.error || 'Failed to add employee');
                }
            } catch (err) {
                alert('Connection error');
            }
        }

        async function deleteEmployee(id) {
            if (!confirm("Are you sure you want to permanently delete this employee? This action cannot be undone.")) return;
            
            try {
                const res = await fetch(`http://localhost:5000/admin/employee/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await res.json();
                if (res.ok) {
                    fetchEmployees();
                } else {
                    alert(data.error || 'Failed to delete employee');
                }
            } catch (err) {
                alert('Connection error');
            }
        }
    </script>
</body>
</html>
