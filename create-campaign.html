<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Campaign - PhishGuard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Red+Hat+Display:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        :root {
            --cyber-black: #0a0e17;
            --cyber-panel: #1a1f2e;
            --cyber-blue: #00d9ff;
            --cyber-red: #ff0055;
            --cyber-purple: #9945ff;
            --cyber-green: #00ff88;
            --cyber-white: #e8f4f8
        }

        body {
            font-family: 'Red Hat Display', sans-serif;
            background: linear-gradient(120deg, #0a0e17 0%, #141a29 100%);
            color: var(--cyber-white);
            min-height: 100vh;
            padding: 28px
        }

        .grid-bg {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px);
            background-size: 42px 42px;
            pointer-events: none;
            z-index: 0
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 2
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 22px
        }

        .topbar h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--cyber-blue);
            font-size: 1.6rem;
            letter-spacing: 0.06em
        }

        .topbar p {
            margin-top: 7px;
            color: rgba(232, 244, 248, 0.76)
        }

        .topbar a {
            text-decoration: none;
            padding: 10px 14px;
            border: 1px solid rgba(0, 217, 255, 0.35);
            border-radius: 10px;
            color: var(--cyber-white);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            background: rgba(26, 31, 46, 0.75);
            transition: all 0.25s
        }

        .topbar a:hover {
            border-color: var(--cyber-blue);
            box-shadow: 0 0 18px rgba(0, 217, 255, 0.22)
        }

        .form-card {
            background: rgba(26, 31, 46, 0.85);
            border: 1px solid rgba(0, 217, 255, 0.25);
            border-radius: 14px;
            padding: 24px
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .field.full {
            grid-column: 1 / -1
        }

        .label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(232, 244, 248, 0.88)
        }

        .input,
        .select {
            width: 100%;
            padding: 13px 14px;
            border: 2px solid rgba(0, 217, 255, 0.25);
            border-radius: 10px;
            background: rgba(10, 14, 23, 0.7);
            color: var(--cyber-white);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s
        }

        .input:focus,
        .select:focus {
            border-color: var(--cyber-blue);
            box-shadow: 0 0 16px rgba(0, 217, 255, 0.2)
        }

        .select option {
            color: #111
        }

        .send-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap
        }

        .option {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(10, 14, 23, 0.6);
            border: 1px solid rgba(0, 217, 255, 0.24);
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer
        }

        .option input {
            accent-color: #00d9ff
        }

        .hint {
            font-size: 0.84rem;
            color: rgba(232, 244, 248, 0.7)
        }

        .actions {
            margin-top: 24px;
            display: flex;
            justify-content: flex-end
        }

        .launch-btn {
            padding: 13px 22px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--cyber-blue), var(--cyber-purple));
            color: #0a0e17;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
            transition: all 0.25s
        }

        .launch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 24px rgba(0, 217, 255, 0.55)
        }

        .notice {
            margin-top: 14px;
            padding: 11px 12px;
            border: 1px dashed rgba(0, 255, 136, 0.45);
            background: rgba(0, 255, 136, 0.08);
            border-radius: 10px;
            color: var(--cyber-green);
            font-size: 0.85rem;
            display: none
        }

        .notice.show {
            display: block
        }

        @media(max-width:760px) {
            body {
                padding: 16px
            }

            .topbar {
                flex-direction: column
            }

            .form-grid {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <div class="grid-bg"></div>
    <div class="container">
        <header class="topbar">
            <div>
                <h1>Create Campaign</h1>
                <p>Configure and launch a live simulated phishing campaign.</p>
            </div>
            <a href="admin-dashboard.html">Back to Dashboard</a>
        </header>

        <section class="form-card">
            <form id="campaignForm">
                <div class="form-grid">
                    <div class="field full">
                        <label class="label" for="campaignName">Campaign Name</label>
                        <input class="input" id="campaignName" type="text" placeholder="Q2 Credential Awareness Drill"
                            required>
                    </div>

                    <div class="field">
                        <label class="label" for="template">Select Template</label>
                        <select class="select" id="template" required>
                            <option value="">Choose a template</option>
                            <option>Invoice Payment Reminder</option>
                            <option>Password Expiry Notice</option>
                            <option>Package Delivery Alert</option>
                            <option>Urgent HR Policy Update</option>
                            <option>Custom Template (Draft)</option>
                            <option>Salary Credit Issue</option>
                            <option>Reimbursement Approval Required</option>
                            <option>Tax Document Submission</option>
                            <option>Bank Account Verification</option>
                            <option>Unexpected Bonus Notification</option>
                            <option>Unusual Login Attempt</option>
                            <option>Account Locked - Immediate Action</option>
                            <option>Courier Delivery Failed</option>
                            <option>Package Held at Customs</option>
                            <option>Shipment Tracking Update</option>
                            <option>Delivery Address Confirmation</option>
                            <option>HR Document Submission</option>
                            <option>Leave Approval Update</option>
                            <option>Policy Violation Notice</option>
                            <option>Shared Google Drive Document</option>
                            <option>Confidential File Access</option>
                            <option>Updated Contract Document</option>
                            <option>Invoice Attachment Download</option>
                            <option>Gift Card Purchase Request</option>
                            <option>Email Storage Full Warning</option>
                            <option>Cloud Storage Expiry Notice</option>
                            <option>Single Sign-On (SSO) Expiry</option>
                        </select>
                    </div>

                    <div class="field">
                        <label class="label" for="category">Category</label>
                        <select class="select" id="category" required>
                            <option value="">Select category</option>
                            <option value="Financial">Financial</option>
                            <option value="Security">Security</option>
                            <option value="Delivery">Delivery</option>
                            <option value="HR">HR</option>
                            <option value="Cloud">Cloud</option>
                            <option value="General">General</option>
                        </select>
                    </div>

                    <div class="field">
                        <label class="label" for="department">Department (if needed)</label>
                        <select class="select" id="department">
                            <option value="">Select department</option>
                            <option>Finance</option>
                            <option>HR</option>
                            <option>Operations</option>
                            <option>Marketing</option>
                            <option>Sales</option>
                            <option>IT Security</option>
                        </select>
                    </div>

                    <div class="field full">
                        <span class="label">Send To</span>
                        <div class="send-options">
                            <label class="option">
                                <input type="radio" name="sendTo" value="all" checked>
                                <span>All Employees</span>
                            </label>
                            <label class="option">
                                <input type="radio" name="sendTo" value="department">
                                <span>Specific Department</span>
                            </label>
                        </div>
                        <p class="hint">If you choose department, pick one from the department dropdown.</p>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" class="launch-btn">Launch Campaign</button>
                </div>
                <!-- Notice block removed -->
            </form>
        </section>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("user"));
        const token = localStorage.getItem("phishguard_token");
        if (!user || user.role !== "admin" || !token) {
            window.location.href = "login.html";
        }

        const deptSelect = document.getElementById("department");
        const sendRadios = document.getElementsByName("sendTo");

        deptSelect.disabled = true;

        sendRadios.forEach(radio => {
            radio.addEventListener("change", function() {
                if (this.value === "all") {
                    deptSelect.disabled = true;
                    deptSelect.value = ""; 
                } else {
                    deptSelect.disabled = false;
                }
            });
        });

        document.getElementById("campaignForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const campaignName = document.getElementById("campaignName").value;
            const template = document.getElementById("template").value;
            const category = document.getElementById("category").value;
            let department = document.getElementById("department").value;

            const sendToAll = document.querySelector('input[name="sendTo"]:checked').value === "all";
            if (sendToAll) {
                department = "All";
            } else if (!department) {
                alert("Please select a specific department ❌");
                return;
            }



            try {
                const res = await fetch("http://localhost:5000/campaign", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        campaignName,
                        template,
                        category,
                        department,
                        createdBy: user.email
                    })
                });

                const data = await res.json();

                if (data.message) {
                    alert("Campaign Created Successfully ✅");

                    // OPTIONAL: reset form
                    document.getElementById("campaignForm").reset();
                }

            } catch (error) {
                console.error(error);
                alert("Error creating campaign ❌");
            }
        });
    </script>
</body>

</html>
