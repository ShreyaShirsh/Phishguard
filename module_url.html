<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --pg-bg: #0d1117;
        --pg-surface: #161b22;
        --pg-border: #21262d;
        --pg-cyan: #00e5c8;
        --pg-text: #e6edf3;
        --pg-muted: #7d8590;
        --pg-red: #f85149;
        --pg-green: #3fb950;
        --font-sans: system-ui, -apple-system, blinkmacsystemfont, "Segoe UI", roboto, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    body {
        background: var(--pg-bg);
        color: var(--pg-text);
        font-family: var(--font-sans);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .topbar {
        padding: 18px 24px;
        border-bottom: 1px solid var(--pg-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--pg-surface);
    }

    .topbar-left h1 {
        font-size: 20px;
        font-weight: 500;
        color: var(--pg-cyan);
    }

    .topbar-left p {
        font-size: 13px;
        color: var(--pg-muted);
        margin-top: 4px;
    }

    .btn-back {
        background: transparent;
        border: 1px solid var(--pg-border);
        color: var(--pg-text);
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        text-decoration: none;
    }

    .btn-back:hover {
        background: rgba(255, 255, 255, 0.05);
    }

    .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        max-width: 900px;
        margin: 0 auto;
        width: 100%;
    }

    .game-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .game-level {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--pg-muted);
        margin-bottom: 8px;
    }

    .game-instruction {
        font-size: 18px;
        color: var(--pg-text);
    }

    .url-display {
        display: flex;
        background: var(--pg-surface);
        border: 1px solid var(--pg-border);
        border-radius: 12px;
        padding: 24px 32px;
        font-family: var(--font-mono);
        font-size: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        margin-bottom: 40px;
        position: relative;
    }

    .url-part {
        position: relative;
        cursor: crosshair;
        padding: 4px 2px;
        border-radius: 4px;
        transition: all 0.2s;
        color: var(--pg-text);
    }

    .url-part:hover {
        background: rgba(0, 229, 200, 0.1);
        color: var(--pg-cyan);
    }

    .url-part.selected-correct {
        background: rgba(63, 185, 80, 0.2);
        color: var(--pg-green);
        box-shadow: 0 0 10px rgba(63, 185, 80, 0.4);
    }

    .url-part.selected-wrong {
        background: rgba(248, 81, 73, 0.2);
        color: var(--pg-red);
        animation: shake 0.4s;
    }

    .part-label {
        position: absolute;
        bottom: -24px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        color: var(--pg-muted);
        font-family: var(--font-sans);
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        white-space: nowrap;
    }

    .url-part:hover .part-label {
        opacity: 1;
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
    }

    .feedback-area {
        height: 60px;
        text-align: center;
        font-size: 15px;
        margin-bottom: 20px;
    }

    .feedback-success {
        color: var(--pg-green);
    }

    .feedback-error {
        color: var(--pg-red);
    }

    .stats-panel {
        display: flex;
        gap: 20px;
        margin-top: auto;
    }

    .stat-box {
        background: var(--pg-surface);
        border: 1px solid var(--pg-border);
        border-radius: 8px;
        padding: 12px 20px;
        text-align: center;
        min-width: 120px;
    }

    .stat-title {
        font-size: 11px;
        color: var(--pg-muted);
        margin-bottom: 4px;
        text-transform: uppercase;
    }

    .stat-value {
        font-size: 20px;
        font-weight: 500;
        color: var(--pg-cyan);
    }

    .btn-next {
        background: rgba(0, 229, 200, 0.1);
        color: var(--pg-cyan);
        border: 1px solid var(--pg-cyan);
        padding: 10px 24px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        display: none;
        transition: all 0.2s;
    }

    .btn-next:hover {
        background: rgba(0, 229, 200, 0.2);
    }
</style>

<div class="topbar">
    <div class="topbar-left">
        <h1>URL Dissection Lab</h1>
        <p>Pick apart domains character by character to identify the threat.</p>
    </div>
    <a href="gamified_training.html" class="btn-back">← Back to Dashboard</a>
</div>

<div class="main-content">
    <div class="game-header">
        <div class="game-level" id="levelDisplay">Round 1 of 3</div>
        <div class="game-instruction">Click the specific part of this URL that makes it malicious.</div>
    </div>

    <div class="url-display" id="urlContainer">
        <!-- Rendered via JS -->
    </div>

    <div class="feedback-area" id="feedback"></div>

    <button id="nextBtn" class="btn-next" onclick="nextRound()">Next Round →</button>

    <div class="stats-panel">
        <div class="stat-box">
            <div class="stat-title">Session XP</div>
            <div class="stat-value" id="xpDisplay">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-title">Accuracy</div>
            <div class="stat-value" id="accDisplay">100%</div>
        </div>
    </div>
</div>

<script>
    const levels = [
        {
            parts: [
                { text: "https://", label: "Protocol", isMalicious: false },
                { text: "accounts.", label: "Subdomain", isMalicious: false },
                { text: "googIe", label: "Domain", isMalicious: true, hint: "Homoglyph attack using capital 'I' instead of lower 'l'" },
                { text: ".com", label: "TLD", isMalicious: false },
                { text: "/login", label: "Path", isMalicious: false }
            ]
        },
        {
            parts: [
                { text: "https://", label: "Protocol", isMalicious: false },
                { text: "secure-login.", label: "Subdomain", isMalicious: false },
                { text: "paypal", label: "Subdomain", isMalicious: false },
                { text: ".billing-updates", label: "Domain", isMalicious: true, hint: "The real domain is billing-updates.com, using paypal as a misleading subdomain." },
                { text: ".com", label: "TLD", isMalicious: false },
            ]
        },
        {
            parts: [
                { text: "https://", label: "Protocol", isMalicious: false },
                { text: "www.amazon-", label: "Subdomain", isMalicious: false },
                { text: "support", label: "Domain", isMalicious: true, hint: "Hyphenated lookalike domain (amazon-support.com), not amazon.com" },
                { text: ".com", label: "TLD", isMalicious: false },
                { text: "/security-check", label: "Path", isMalicious: false }
            ]
        }
    ];

    let currentRound = 0;
    let xp = 0;
    let attempts = 0;
    let hits = 0;
    let roundFinished = false;

    function renderRound() {
        roundFinished = false;
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('feedback').innerHTML = '';
        document.getElementById('levelDisplay').textContent = `Round ${currentRound + 1} of ${levels.length}`;
        
        const container = document.getElementById('urlContainer');
        container.innerHTML = '';
        
        const level = levels[currentRound];
        level.parts.forEach((part, index) => {
            const span = document.createElement('span');
            span.className = 'url-part';
            span.textContent = part.text;
            
            const label = document.createElement('span');
            label.className = 'part-label';
            label.textContent = part.label;
            span.appendChild(label);
            
            span.onclick = () => handlePartClick(part, span);
            container.appendChild(span);
        });
    }

    function handlePartClick(part, element) {
        if (roundFinished) return;
        attempts++;

        if (part.isMalicious) {
            element.classList.add('selected-correct');
            document.getElementById('feedback').innerHTML = `
                <div class="feedback-success"><strong>Target Eliminated!</strong> ${part.hint}</div>
                <div style="font-size:12px; color:var(--pg-muted); margin-top:4px;">+100 XP</div>
            `;
            hits++;
            xp += 100;
            roundFinished = true;
            document.getElementById('nextBtn').style.display = 'inline-block';
            
            if(currentRound === levels.length - 1) {
                document.getElementById('nextBtn').textContent = 'Complete Module';
            }
        } else {
            element.classList.add('selected-wrong');
            document.getElementById('feedback').innerHTML = `
                <div class="feedback-error"><strong>Miss!</strong> That part is safe. Look closer at the structure.</div>
                <div style="font-size:12px; color:var(--pg-red); margin-top:4px;">-20 XP</div>
            `;
            xp = Math.max(0, xp - 20);
            setTimeout(() => {
                element.classList.remove('selected-wrong');
            }, 500);
        }
        updateStats();
    }

    function updateStats() {
        document.getElementById('xpDisplay').textContent = xp;
        if (attempts > 0) {
            document.getElementById('accDisplay').textContent = Math.round((hits / attempts) * 100) + '%';
        }
    }

    async function finishModule(xpEarned) {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));
        if (token && user) {
            try {
                await fetch(`http://localhost:5000/employee/${user.email}/gamified-complete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ moduleId: 'url', xpEarned: xpEarned, passed: xpEarned > 0 })
                });
            } catch (e) {
                console.error(e);
            }
        }
    }

    async function nextRound() {
        if (currentRound < levels.length - 1) {
            currentRound++;
            renderRound();
        } else {
            // Module Complete
            document.getElementById('urlContainer').innerHTML = `<div style="color:var(--pg-cyan)">Simulation Complete. Generating Report...</div>`;
            document.getElementById('feedback').innerHTML = `You earned ${xp} XP with ${Math.round((hits/attempts)*100)}% accuracy. Saving progress...`;
            document.getElementById('nextBtn').style.display = 'none';
            
            await finishModule(xp);
            setTimeout(() => {
                window.location.href = 'gamified_training.html';
            }, 2000);
        }
    }

    renderRound();
</script>
