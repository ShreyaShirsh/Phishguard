<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PhishGuard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Red+Hat+Display:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        :root {
            --cyber-black: #0a0e17;
            --cyber-blue: #00d9ff;
            --cyber-red: #ff0055;
            --cyber-purple: #9945ff;
            --cyber-green: #00ff88;
            --cyber-white: #e8f4f8
        }

        body {
            font-family: 'Red Hat Display', sans-serif;
            background: var(--cyber-black);
            color: var(--cyber-white);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative
        }

        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridScroll 20s linear infinite;
            pointer-events: none;
            z-index: 0
        }

        @keyframes gridScroll {
            0% {
                transform: translateY(0)
            }

            100% {
                transform: translateY(50px)
            }
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 217, 255, 0.02) 50%, transparent 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.5
        }

        .register-container {
            position: relative;
            z-index: 2;
            max-width: 500px;
            width: 100%;
            padding: 20px
        }

        .register-card {
            background: rgba(26, 31, 46, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid var(--cyber-blue);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 0 40px rgba(0, 217, 255, 0.3);
            animation: fadeInUp 0.6s ease-out
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 35px
        }

        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--cyber-blue), var(--cyber-purple), var(--cyber-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px
        }

        .logo-subtitle {
            font-size: 0.9rem;
            color: var(--cyber-blue);
            letter-spacing: 0.2em;
            text-transform: uppercase
        }

        .form-group {
            margin-bottom: 22px
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--cyber-blue);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 217, 255, 0.3);
            border-radius: 10px;
            color: var(--cyber-white);
            font-size: 1rem;
            font-family: 'Red Hat Display', sans-serif;
            transition: all 0.3s ease
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--cyber-blue);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.3);
            background: rgba(0, 0, 0, 0.5)
        }

        .form-input::placeholder {
            color: rgba(232, 244, 248, 0.45)
        }

        .form-select option {
            color: #111
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--cyber-blue), var(--cyber-purple));
            border: none;
            border-radius: 10px;
            color: var(--cyber-black);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3)
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.6)
        }

        .message {
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none
        }

        .message.error {
            background: rgba(255, 0, 85, 0.2);
            border: 1px solid var(--cyber-red);
            color: var(--cyber-red)
        }

        .message.success {
            background: rgba(0, 255, 136, 0.14);
            border: 1px solid var(--cyber-green);
            color: var(--cyber-green)
        }

        .message.show {
            display: block
        }

        .password-hint {
            margin-top: 8px;
            color: rgba(232, 244, 248, 0.7);
            font-size: 0.82rem
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 0.9rem
        }

        .login-link a {
            color: var(--cyber-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s
        }

        .login-link a:hover {
            color: var(--cyber-purple)
        }

        .back-home {
            text-align: center;
            margin-top: 14px
        }

        .back-home a {
            color: rgba(232, 244, 248, 0.6);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s
        }

        .back-home a:hover {
            color: var(--cyber-blue)
        }

        @media(max-width:768px) {
            .register-card {
                padding: 40px 28px
            }

            .logo-title {
                font-size: 2rem
            }
        }
    </style>
</head>

<body>
    <div class="cyber-grid"></div>
    <div class="scanlines"></div>

    <div class="register-container">
        <div class="register-card">
            <div class="logo">
                <h1 class="logo-title">PHISHGUARD</h1>
                <p class="logo-subtitle">Create New Account</p>
            </div>

            <div class="message error" id="errorMessage"></div>
            <div class="message success" id="successMessage"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">

                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-input" placeholder="Enter your name" pattern="[A-Za-z\s]+" title="Name must contain only letters and spaces" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter password" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="role">Role</label>
                    <select id="role" class="form-select" required>
                        <option value="">Select role</option>
                        <option value="admin">Admin</option>
                        <option value="employee">Employee</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Department</label>
                    <select id="department" class="form-select" required>
                        <option value="">Select department</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Create Account</button>

            </form>

            <div class="login-link">
                Already have an account? <a href="login.html">Sign in here</a>
            </div>

            <div class="back-home">
                <a href="index.html">&larr; Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        const roleSelect = document.getElementById("role");
        const deptSelect = document.getElementById("department");

        roleSelect.addEventListener("change", function() {
            if (this.value === "admin") {
                deptSelect.removeAttribute("required");
                deptSelect.disabled = true;
                deptSelect.value = "";
            } else {
                deptSelect.setAttribute("required", "true");
                deptSelect.disabled = false;
            }
        });

        async function handleRegister(event) {
            event.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const role = document.getElementById("role").value;
            const department = document.getElementById("department").value;

            document.getElementById("errorMessage").classList.remove("show");
            document.getElementById("successMessage").classList.remove("show");

            try {
                const res = await fetch("http://localhost:5000/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name,
                        email,
                        password,
                        role,
                        department
                    })
                });

                const data = await res.json();

                if (data.message) {
                    document.getElementById("successMessage").innerHTML = "Registered Successfully ✅ Redirecting...";
                    document.getElementById("successMessage").classList.add("show");
                    setTimeout(() => window.location.href = "login.html", 1500);
                } else {
                    document.getElementById("errorMessage").innerHTML = data.error || "Registration failed ❌";
                    document.getElementById("errorMessage").classList.add("show");
                }

            } catch (error) {
                console.error(error);
                document.getElementById("errorMessage").innerHTML = "Error connecting to server ❌";
                document.getElementById("errorMessage").classList.add("show");
            }
        }
    </script>
</body>

</html>
